  db:
    image: mongodb/mongodb-atlas-local
    restart: always

    environment:
      MONGODB_INITDB_ROOT_USERNAME: user
      MONGODB_INITDB_ROOT_PASSWORD: pass

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - mongo-search:/data/mongot

